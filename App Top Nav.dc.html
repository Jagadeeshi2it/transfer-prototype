<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:50},&quot;org&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Onco Demo&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;clinic&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Onco Clinic Center&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;station&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Onco Station&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;user&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;John Doe&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  componentWillUnmount() { if (this._dsWait) clearInterval(this._dsWait); }

  chips() {
    const NS = window.AllyUIDesignSystem_f878db;
    if (!NS || !NS.TopNavChip) {
      if (!this._dsWait) {
        this._dsWait = setInterval(() => {
          if (window.AllyUIDesignSystem_f878db) { clearInterval(this._dsWait); this._dsWait = null; this.forceUpdate(); }
        }, 100);
      }
      return null;
    }
    const C = NS.TopNavChip, noop = () => {};
    const rule = k => React.createElement(NS.TopNavDivider, { key: k });
    const out = [];
    const push = (key, iconName, text, live) => {
      if (!text) return;
      if (out.length) out.push(rule("d" + key));
      out.push(React.createElement(C, live ? { key, iconName, onClick: noop } : { key, iconName }, text));
    };
    push("org", "building", this.props.org ?? "Onco Demo", true);
    push("clinic", "marker", this.props.clinic ?? "Onco Clinic Center", true);
    push("station", "box", this.props.station ?? "Onco Station", false);
    return out;
  }

  renderVals() {
    return { user: this.props.user ?? "John Doe", chips: this.chips() };
  }
}
</script>
